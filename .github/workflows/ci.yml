name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly dependency re-scan: advisories are published against
    # versions we already ship — the lockfile does not change on its
    # own, so a schedule (not just PRs) is what catches new CVEs
    # (roadmap item 16: never silently accept known vulnerabilities).
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check, test (py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install uv (with Python ${{ matrix.python-version }})
        uses: astral-sh/setup-uv@v6.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (locked, with dev/test extras)
        run: uv sync --locked --all-extras

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy (strict)
        run: uv run mypy .

      - name: pytest
        run: uv run pytest

  coverage:
    name: Critical-path coverage gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@v6.4.0

      - name: Install dependencies (locked, with dev/test extras)
        run: uv sync --locked --all-extras

      - name: pytest with coverage (parallel workers — isolation proof)
        # Roadmap item 20: the suite runs GREEN under parallel workers,
        # which is the strongest order/shared-state isolation proof.
        # Wall-clock measurement tests self-skip under xdist (see
        # tests/test_rate_limit_stress.py) and run in the serial job.
        run: uv run pytest -q -n 4 --cov=autoclaimer --cov-report=json:coverage.json

      - name: Enforce per-module floors
        # Roadmap item 18: regression fences on the critical modules —
        # a floor drop means a behavior/failure path lost its tests.
        run: uv run python scripts/coverage-gates.py

  dependency-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@v6.4.0

      - name: Export locked requirements (production + dev/test extras)
        # --locked fails the job when uv.lock is out of sync with
        # pyproject.toml (roadmap item 16: keep lockfiles synchronized).
        run: uv export --locked --all-extras --no-emit-project -o requirements.txt

      - name: pip-audit (all known vulnerabilities fail the job)
        # Policy: ANY known vulnerability in ANY scanned dependency
        # (production and development) fails this job. Intentional
        # exceptions are EXPLICIT and must carry a reason + expiry:
        # append `--ignore-vuln GHSA-XXXX-XXXX-XXXX` below with a
        # comment, and link the analysis in the PR that adds it.
        run: |
          uvx pip-audit \
            --disable-pip \
            --require-hashes \
            -r requirements.txt

  verify-actions-lockfile:
    name: Verify actions lockfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Verify pinned actions against the lockfile
        run: |
          gh extension install github/gh-actions-lock
          gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
