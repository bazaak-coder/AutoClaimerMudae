name: CI

on:
  push:
    branches: [main]
  pull_request:
  # NOTE: the weekly CVE re-scan schedule moved to security.yml with
  # the dependency-audit job (workflow-structure recommendation
  # 2026-11-05); this workflow is PR/push verification only.

# Recommendation B: obsolete runs on superseded PR commits are
# cancelled instead of consuming Actions minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check, test (py${{ matrix.python-version }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          # Recommendation D: no authenticated Git operations here
          persist-credentials: false

      - name: Install uv (with Python ${{ matrix.python-version }})
        uses: astral-sh/setup-uv@v6.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (locked, with dev/test extras)
        run: uv sync --locked --all-extras

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy (strict)
        run: uv run mypy .

      - name: pytest
        run: uv run pytest

  coverage:
    name: Critical-path coverage gates
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          # Recommendation D: no authenticated Git operations here
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6.4.0

      - name: Install dependencies (locked, with dev/test extras)
        run: uv sync --locked --all-extras

      - name: pytest with coverage (parallel workers — isolation proof)
        # Roadmap item 20: the suite runs GREEN under parallel workers,
        # which is the strongest order/shared-state isolation proof.
        # Wall-clock measurement tests self-skip under xdist (see
        # tests/test_rate_limit_stress.py) and run in the serial job.
        run: uv run pytest -q -n 4 --cov=autoclaimer --cov-report=json:coverage.json

      - name: Enforce per-module floors
        # Roadmap item 18: regression fences on the critical modules —
        # a floor drop means a behavior/failure path lost its tests.
        run: uv run python scripts/coverage-gates.py

  build:
    name: Build distribution
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          # Recommendation D: no authenticated Git operations here
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6.4.0

      - name: Build sdist and wheel
        # Packaging gap (workflow-structure recommendation 2026-11-05):
        # nothing previously verified the project still BUILDS — the
        # wheel is what a deployment actually installs.
        run: uv build

      - name: Sanity-check artifacts
        run: |
          ls -la dist/
          test -n "$(find dist -maxdepth 1 -name '*.tar.gz')" || { echo "no sdist"; exit 1; }
          test -n "$(find dist -maxdepth 1 -name '*.whl')" || { echo "no wheel"; exit 1; }

      - name: Inspect wheel contents (no tests, dev files, or local config)
        # Recommendation A: the wheel must ship ONLY the package and its
        # metadata — source-tree tests cannot detect packaging leaks.
        run: |
          python -m zipfile -l dist/*.whl | awk 'NR>1 {print $1}' | sort > wheel-files.txt
          cat wheel-files.txt
          if grep -Eqi '(^|/)(tests|knowledgebase|\.venv|\.github)(/|$)|accounts\.json$|config\.json$|state\.db(\.|$)|\.db$|\.env$' wheel-files.txt; then
            echo "::error::wheel packages files it must not (tests, dev files, local config, or credentials)"
            grep -Ei '(^|/)(tests|knowledgebase|\.venv|\.github)(/|$)|accounts\.json$|config\.json$|state\.db(\.|$)|\.db$|\.env$' wheel-files.txt || true
            exit 1
          fi
          # Everything must live under autoclaimer/ or the dist-info.
          if grep -Ev '^(autoclaimer/|autoclaimer-[0-9][^/]*\.dist-info/)' wheel-files.txt; then
            echo "::error::wheel contains paths outside the package"
            exit 1
          fi

      - name: Clean-install the wheel (no dev extras) and import it
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install --quiet dist/*.whl
          /tmp/wheel-check/bin/pip check
          # -I (isolated mode): running from the repo root would put the
          # CHECKOUT ahead of the installed wheel on sys.path and an
          # incomplete wheel would pass by importing the source tree.
          /tmp/wheel-check/bin/python -I -c \
            "import autoclaimer, autoclaimer.cli, autoclaimer.mudae_parser; print('import-ok')"

  verify-actions-lockfile:
    name: Verify actions lockfile
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          # Recommendation D: no authenticated Git operations here
          persist-credentials: false

      - name: Verify pinned actions against the lockfile
        run: |
          gh extension install github/gh-actions-lock
          gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
