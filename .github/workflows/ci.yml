name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install uv (with Python 3.14)
        uses: astral-sh/setup-uv@v6.4.0
        with:
          python-version: "3.14"

      - name: Install dependencies (locked, with dev/test extras)
        run: uv sync --locked --all-extras

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy (strict)
        run: uv run mypy .

      - name: pytest
        run: uv run pytest

  verify-actions-lockfile:
    name: Verify actions lockfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Verify pinned actions against the lockfile
        run: |
          gh extension install github/gh-actions-lock
          gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
