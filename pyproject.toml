[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoclaimer"
version = "0.2.0"
description = "Lightweight configurable task-runner framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "discord.py-self>=2.1.0,<2.2",
    "cryptography>=42.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "hypothesis>=6",
    "pytest-xdist>=3",
]
dev = [
    "autoclaimer[test]",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["autoclaimer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
# Vendored upstream parser + its ported tests: excluded from
# lint/format discovery — upstream style preserved byte-identical
# (see autoclaimer/mudae_parser/VENDORED.md).
exclude = [
    "autoclaimer/mudae_parser",
    "tests/test_mudae_parser.py",
    "tests/test_mudae_parser_strings.py",
    "tests/test_mudae_parser_settings.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
# Vendored upstream parser + its ported tests: proven by their own suite
# (80 tests); kept byte-identical to upstream, so AutoClaimer's strict
# preset does not apply (see autoclaimer/mudae_parser/VENDORED.md).
module = [
    "autoclaimer.mudae_parser",
    "autoclaimer.mudae_parser.*",
    "test_mudae_parser",
    "test_mudae_parser_strings",
    "test_mudae_parser_settings",
]
ignore_errors = true
