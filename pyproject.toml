[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoclaimer"
version = "0.2.0"
description = "Lightweight configurable task-runner framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["discord.py-self>=2.1.0,<2.2"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]
dev = [
    "autoclaimer[test]",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools]
packages = ["autoclaimer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
